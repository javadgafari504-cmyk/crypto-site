<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اخبار ارز دیجیتال | کریپتو پرو</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .news-list { display: flex; flex-direction: column; gap: 12px; }
        .news-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px; padding: 18px;
            transition: all 0.3s; cursor: pointer;
            text-decoration: none; color: inherit;
            display: block;
        }
        body.light-mode .news-card { background: #fff; }
        .news-card:hover { transform: translateX(-5px); border-color: rgba(240,185,11,0.4); }
        .news-source {
            display: inline-block; padding: 3px 10px;
            background: rgba(240,185,11,0.15); color: #f0b90b;
            border-radius: 10px; font-size: 0.7rem;
            font-weight: 700; margin-bottom: 10px;
        }
        .news-title { font-size: 0.95rem; font-weight: 800; line-height: 1.6; margin-bottom: 8px; }
        .news-meta { font-size: 0.75rem; opacity: 0.6; display: flex; gap: 15px; flex-wrap: wrap; }
        .news-body { font-size: 0.82rem; opacity: 0.7; margin-top: 8px; line-height: 1.7; }
        
        .news-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .news-tab {
            padding: 10px 20px; background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 20px;
            color: inherit; font-family: inherit; font-size: 0.85rem;
            cursor: pointer; transition: all 0.3s; font-weight: 600;
        }
        .news-tab.active { background: rgba(240,185,11,0.25); border-color: #f0b90b; color: #f0b90b; font-weight: 800; }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <button id="theme-toggle">🌙</button>
            <div class="logo"><span class="logo-icon">💎</span><span class="logo-text">کریپتو پرو</span></div>
        </div>
        <nav class="main-nav">
            <a href="index.html" class="nav-link">🏠 خانه</a>
            <a href="markets.html" class="nav-link">📊 بازارها</a>
            <a href="portfolio.html" class="nav-link">💼 پرتفوی</a>
            <a href="calculator.html" class="nav-link">🧮 ماشین‌حساب</a>
            <a href="compare.html" class="nav-link">⚖️ مقایسه</a>
            <a href="news.html" class="nav-link active">📰 اخبار</a>
            <a href="alerts.html" class="nav-link">🔔 هشدارها</a>
        </nav>
    </header>

    <main>
        <h1 style="color:#f0b90b; text-align:center; margin-bottom:25px;">📰 اخبار ارز دیجیتال</h1>
        
        <div class="news-tabs">
            <button class="news-tab active" data-filter="all">🌐 همه</button>
            <button class="news-tab" data-filter="bitcoin">₿ بیت‌کوین</button>
            <button class="news-tab" data-filter="ethereum">Ξ اتریوم</button>
            <button class="news-tab" data-filter="regulation">⚖️ مقررات</button>
            <button class="news-tab" data-filter="defi">🏦 DeFi</button>
            <button class="news-tab" data-filter="nft">🖼️ NFT</button>
        </div>
        
        <div class="news-list" id="news-list">
            <p class="loading-text">⏳ در حال دریافت اخبار...</p>
        </div>
    </main>

    <footer><div class="footer-bottom"><p>© ۲۰۲۶ کریپتو پرو</p></div></footer>

    <script>
        let allNews = [];
        let currentFilter = 'all';

        const themeBtn = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); themeBtn.textContent = '☀️'; }
        else themeBtn.textContent = '🌙';
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            themeBtn.textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        });

        async function loadNews() {
            try {
                // استفاده از CryptoCompare API (رایگان)
                const res = await fetch('https://min-api.cryptocompare.com/data/v2/news/?lang=EN&sortOrder=latest');
                const data = await res.json();
                allNews = data.Data || [];
                renderNews();
            } catch (e) {
                console.error(e);
                document.getElementById('news-list').innerHTML = '<p class="loading-text">❌ خطا در دریافت اخبار</p>';
            }
        }

        function renderNews() {
            const list = document.getElementById('news-list');
            let filtered = allNews;
            
            if (currentFilter !== 'all') {
                filtered = allNews.filter(n => 
                    n.categories?.toLowerCase().includes(currentFilter) ||
                    n.title?.toLowerCase().includes(currentFilter)
                );
            }
            
            if (filtered.length === 0) {
                list.innerHTML = '<p class="loading-text">خبری در این دسته نیست</p>';
                return;
            }
            
            list.innerHTML = filtered.slice(0, 30).map(n => {
                const date = new Date(n.published_on * 1000);
                const timeAgo = getTimeAgo(date);
                const body = (n.body || '').substring(0, 200) + '...';
                return `
                    <a href="${n.url}" target="_blank" rel="noopener" class="news-card">
                        <span class="news-source">${n.source_info?.name || n.source || 'خبر'}</span>
                        <div class="news-title">${n.title}</div>
                        <div class="news-body">${body}</div>
                        <div class="news-meta">
                            <span>🕐 ${timeAgo}</span>
                            <span>📅 ${date.toLocaleDateString('fa-IR')}</span>
                        </div>
                    </a>
                `;
            }).join('');
        }

        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return 'چند لحظه پیش';
            if (seconds < 3600) return Math.floor(seconds / 60) + ' دقیقه پیش';
            if (seconds < 86400) return Math.floor(seconds / 3600) + ' ساعت پیش';
            return Math.floor(seconds / 86400) + ' روز پیش';
        }

        document.querySelectorAll('.news-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.news-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.filter;
                renderNews();
            });
        });

        loadNews();
        setInterval(loadNews, 300000);
    </script>
</body>
</html>
