<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقایسه ارزها | کریپتو پرو</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .compare-selectors {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            margin-bottom: 25px; max-width: 700px; margin-left: auto; margin-right: auto;
        }
        @media (max-width: 480px) { .compare-selectors { grid-template-columns: 1fr; } }
        
        .compare-select {
            padding: 14px; background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
            color: #fff; font-family: inherit; font-size: 0.9rem;
            cursor: pointer; outline: none; width: 100%;
        }
        body.light-mode .compare-select { background: rgba(0,0,0,0.04); color: #222; }
        
        .compare-cards {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            margin-bottom: 25px;
        }
        @media (max-width: 480px) { .compare-cards { grid-template-columns: 1fr; } }
        
        .compare-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 20px; text-align: center;
        }
        body.light-mode .compare-card { background: #fff; }
        .compare-card img { width: 60px; height: 60px; border-radius: 50%; margin-bottom: 12px; }
        .compare-card h3 { color: #f0b90b; font-size: 1.1rem; margin-bottom: 5px; }
        .compare-card .symbol { font-size: 0.85rem; opacity: 0.6; margin-bottom: 12px; }
        .compare-card .price { font-size: 1.3rem; font-weight: 900; direction: ltr; font-family: 'Courier New', monospace; }
        .compare-card .change { font-size: 0.9rem; font-weight: 700; margin-top: 8px; }
        
        .compare-table {
            width: 100%; border-collapse: collapse;
            background: rgba(255,255,255,0.03);
            border-radius: 14px; overflow: hidden;
            max-width: 700px; margin: 0 auto;
        }
        body.light-mode .compare-table { background: #fff; }
        .compare-table th, .compare-table td {
            padding: 14px; text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 0.85rem;
        }
        .compare-table th { background: rgba(240,185,11,0.15); color: #f0b90b; font-weight: 800; }
        .compare-table td:first-child { text-align: right; font-weight: 700; }
        .compare-table tr:last-child td { border-bottom: none; }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <button id="theme-toggle">🌙</button>
            <div class="logo"><span class="logo-icon">💎</span><span class="logo-text">کریپتو پرو</span></div>
        </div>
        <nav class="main-nav">
            <a href="index.html" class="nav-link">🏠 خانه</a>
            <a href="markets.html" class="nav-link">📊 بازارها</a>
            <a href="portfolio.html" class="nav-link">💼 پرتفوی</a>
            <a href="calculator.html" class="nav-link">🧮 ماشین‌حساب</a>
            <a href="compare.html" class="nav-link active">⚖️ مقایسه</a>
            <a href="news.html" class="nav-link">📰 اخبار</a>
            <a href="alerts.html" class="nav-link">🔔 هشدارها</a>
        </nav>
    </header>

    <main>
        <h1 style="color:#f0b90b; text-align:center; margin-bottom:25px;">⚖️ مقایسه ارزها</h1>
        
        <div class="compare-selectors">
            <select id="coin1" class="compare-select"></select>
            <select id="coin2" class="compare-select"></select>
        </div>
        
        <button id="compare-btn" style="display:block; margin: 0 auto 25px; padding: 14px 40px; background: linear-gradient(135deg, #f0b90b, #d99a00); border: none; border-radius: 30px; color: #222; font-family: inherit; font-weight: 900; font-size: 1rem; cursor: pointer;">⚖️ مقایسه کن</button>
        
        <div id="result-area">
            <p class="loading-text">دو ارز انتخاب کن و دکمه مقایسه رو بزن</p>
        </div>
    </main>

    <footer><div class="footer-bottom"><p>© ۲۰۲۶ کریپتو پرو</p></div></footer>

    <script>
        const API = 'https://api.coingecko.com/api/v3';
        let coins = [];

        const themeBtn = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); themeBtn.textContent = '☀️'; }
        else themeBtn.textContent = '🌙';
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            themeBtn.textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        });

        async function loadCoins() {
            const res = await fetch(`${API}/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&price_change_percentage=24h,7d,30d`);
            coins = await res.json();
            const opts = coins.map(c => `<option value="${c.id}">${c.name} (${c.symbol.toUpperCase()})</option>`).join('');
            document.getElementById('coin1').innerHTML = opts;
            document.getElementById('coin2').innerHTML = opts;
            document.getElementById('coin1').value = 'bitcoin';
            document.getElementById('coin2').value = 'ethereum';
        }

        function formatNum(n) {
            if (!n) return '—';
            if (n >= 1e12) return '$' + (n / 1e12).toFixed(2) + 'T';
            if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
            if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
            return '$' + n.toLocaleString('en-US');
        }

        function formatPrice(p) {
            if (!p) return '—';
            if (p < 0.01) return '$' + p.toFixed(8);
            if (p < 1) return '$' + p.toFixed(6);
            return '$' + p.toLocaleString('en-US', { maximumFractionDigits: 2 });
        }

        document.getElementById('compare-btn').addEventListener('click', () => {
            const c1 = coins.find(c => c.id === document.getElementById('coin1').value);
            const c2 = coins.find(c => c.id === document.getElementById('coin2').value);
            if (!c1 || !c2) return;
            
            const ch1 = c1.price_change_percentage_24h || 0;
            const ch2 = c2.price_change_percentage_24h || 0;
            
            document.getElementById('result-area').innerHTML = `
                <div class="compare-cards">
                    <div class="compare-card">
                        <img src="${c1.image}">
                        <h3>${c1.name}</h3>
                        <p class="symbol">${c1.symbol.toUpperCase()}</p>
                        <p class="price">${formatPrice(c1.current_price)}</p>
                        <p class="change" style="color: ${ch1 >= 0 ? '#0ecb81' : '#f6465d'};">${ch1 >= 0 ? '▲ +' : '▼ '}${Math.abs(ch1).toFixed(2)}%</p>
                    </div>
                    <div class="compare-card">
                        <img src="${c2.image}">
                        <h3>${c2.name}</h3>
                        <p class="symbol">${c2.symbol.toUpperCase()}</p>
                        <p class="price">${formatPrice(c2.current_price)}</p>
                        <p class="change" style="color: ${ch2 >= 0 ? '#0ecb81' : '#f6465d'};">${ch2 >= 0 ? '▲ +' : '▼ '}${Math.abs(ch2).toFixed(2)}%</p>
                    </div>
                </div>
                <table class="compare-table">
                    <tr><th>ویژگی</th><th>${c1.symbol.toUpperCase()}</th><th>${c2.symbol.toUpperCase()}</th></tr>
                    <tr><td>💰 قیمت</td><td>${formatPrice(c1.current_price)}</td><td>${formatPrice(c2.current_price)}</td></tr>
                    <tr><td>📊 مارکت‌کپ</td><td>${formatNum(c1.market_cap)}</td><td>${formatNum(c2.market_cap)}</td></tr>
                    <tr><td>📈 حجم ۲۴h</td><td>${formatNum(c1.total_volume)}</td><td>${formatNum(c2.total_volume)}</td></tr>
                    <tr><td>🏆 رتبه</td><td>#${c1.market_cap_rank}</td><td>#${c2.market_cap_rank}</td></tr>
                    <tr><td>📊 تغییرات ۲۴h</td><td style="color: ${ch1 >= 0 ? '#0ecb81' : '#f6465d'};">${ch1.toFixed(2)}%</td><td style="color: ${ch2 >= 0 ? '#0ecb81' : '#f6465d'};">${ch2.toFixed(2)}%</td></tr>
                    <tr><td>📅 تغییرات ۷d</td><td>${(c1.price_change_percentage_7d_in_currency || 0).toFixed(2)}%</td><td>${(c2.price_change_percentage_7d_in_currency || 0).toFixed(2)}%</td></tr>
                    <tr><td>📅 تغییرات ۳۰d</td><td>${(c1.price_change_percentage_30d_in_currency || 0).toFixed(2)}%</td><td>${(c2.price_change_percentage_30d_in_currency || 0).toFixed(2)}%</td></tr>
                    <tr><td>🔺 بالاترین تاریخ</td><td>${formatPrice(c1.ath)}</td><td>${formatPrice(c2.ath)}</td></tr>
                    <tr><td>🪙 عرضه در گردش</td><td>${(c1.circulating_supply || 0).toLocaleString('en-US', { maximumFractionDigits: 0 })}</td><td>${(c2.circulating_supply || 0).toLocaleString('en-US', { maximumFractionDigits: 0 })}</td></tr>
                </table>
            `;
        });

        loadCoins();
    </script>
</body>
</html>
