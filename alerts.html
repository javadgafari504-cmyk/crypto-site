<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هشدارهای قیمت | کریپتو پرو</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .alerts-list { display: flex; flex-direction: column; gap: 12px; max-width: 700px; margin: 0 auto; }
        .alert-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px; padding: 18px;
            display: grid; grid-template-columns: 1fr auto auto; gap: 15px;
            align-items: center;
        }
        body.light-mode .alert-card { background: #fff; }
        .alert-card.triggered {
            border-color: #0ecb81;
            background: linear-gradient(135deg, rgba(14,203,129,0.08), transparent);
        }
        .alert-card.pending { border-color: rgba(240,185,11,0.3); }
        
        .alert-coin-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .alert-coin-info img { width: 36px; height: 36px; border-radius: 50%; }
        .alert-coin-name { font-weight: 800; font-size: 0.9rem; color: #f0b90b; }
        .alert-coin-symbol { font-size: 0.75rem; opacity: 0.6; }
        
        .alert-details { text-align: center; font-size: 0.85rem; }
        .alert-target { font-family: 'Courier New', monospace; font-weight: 800; direction: ltr; }
        .alert-type-label { font-size: 0.72rem; opacity: 0.6; margin-top: 4px; }
        
        .alert-status-badge {
            display: inline-block; padding: 3px 10px; border-radius: 12px;
            font-size: 0.7rem; font-weight: 700; margin-top: 6px;
        }
        .alert-status-badge.pending { background: rgba(240,185,11,0.15); color: #f0b90b; }
        .alert-status-badge.triggered { background: rgba(14,203,129,0.15); color: #0ecb81; }
        
        .delete-alert {
            background: rgba(246,70,93,0.2); border: 1px solid rgba(246,70,93,0.3);
            color: #f6465d; padding: 10px 14px; border-radius: 10px;
            cursor: pointer; font-size: 0.85rem;
        }
        
        .add-alert-form {
            max-width: 500px; margin: 0 auto 25px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 22px;
        }
        body.light-mode .add-alert-form { background: #fff; }
        
        .form-row { margin-bottom: 15px; }
        .form-row label { display: block; font-size: 0.82rem; margin-bottom: 6px; color: #f0b90b; font-weight: 700; }
        .form-row select, .form-row input {
            width: 100%; padding: 12px 15px;
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px; color: #fff; font-family: inherit; font-size: 0.9rem;
        }
        body.light-mode .form-row select, body.light-mode .form-row input { background: rgba(0,0,0,0.04); color: #222; }
        
        .radio-group { display: flex; gap: 10px; }
        .radio-item {
            flex: 1; padding: 12px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
            text-align: center; cursor: pointer; transition: all 0.3s;
            font-size: 0.85rem; font-weight: 600;
        }
        .radio-item:has(input:checked) {
            background: rgba(240,185,11,0.2); border-color: #f0b90b; color: #f0b90b;
        }
        .radio-item input { display: none; }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <button id="theme-toggle">🌙</button>
            <div class="logo"><span class="logo-icon">💎</span><span class="logo-text">کریپتو پرو</span></div>
        </div>
        <nav class="main-nav">
            <a href="index.html" class="nav-link">🏠 خانه</a>
            <a href="markets.html" class="nav-link">📊 بازارها</a>
            <a href="portfolio.html" class="nav-link">💼 پرتفوی</a>
            <a href="calculator.html" class="nav-link">🧮 ماشین‌حساب</a>
            <a href="compare.html" class="nav-link">⚖️ مقایسه</a>
            <a href="news.html" class="nav-link">📰 اخبار</a>
            <a href="alerts.html" class="nav-link active">🔔 هشدارها</a>
        </nav>
    </header>

    <main>
        <h1 style="color:#f0b90b; text-align:center; margin-bottom:25px;">🔔 هشدارهای قیمت</h1>
        
        <div class="add-alert-form">
            <div class="form-row">
                <label>ارز</label>
                <select id="coin-select"></select>
            </div>
            <div class="form-row">
                <label>قیمت هدف (دلار)</label>
                <input type="number" id="target-price" step="any" placeholder="مثلاً 100000">
            </div>
            <div class="form-row">
                <label>نوع هشدار</label>
                <div class="radio-group">
                    <label class="radio-item">
                        <input type="radio" name="type" value="above" checked>
                        📈 بالاتر از
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="type" value="below">
                        📉 پایین‌تر از
                    </label>
                </div>
            </div>
            <button id="add-alert-btn" class="submit-btn" style="width:100%; padding:14px; background:linear-gradient(135deg,#0ecb81,#059669); border:none; border-radius:12px; color:#fff; font-family:inherit; font-weight:800; font-size:1rem; cursor:pointer;">➕ افزودن هشدار</button>
        </div>

        <h2 class="section-title">📋 هشدارهای من</h2>
        <div class="alerts-list" id="alerts-list">
            <p class="loading-text">هنوز هشداری تنظیم نکردی</p>
        </div>
    </main>

    <footer><div class="footer-bottom"><p>© ۲۰۲۶ کریپتو پرو</p></div></footer>

    <script>
        const API = 'https://api.coingecko.com/api/v3';
        let allCoins = [];
        let alerts = JSON.parse(localStorage.getItem('alerts') || '[]');

        const themeBtn = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); themeBtn.textContent = '☀️'; }
        else themeBtn.textContent = '🌙';
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            themeBtn.textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        });

        async function loadCoins() {
            const res = await fetch(`${API}/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1`);
            allCoins = await res.json();
            document.getElementById('coin-select').innerHTML = allCoins.map(c => 
                `<option value="${c.id}">${c.name} (${c.symbol.toUpperCase()}) — $${c.current_price.toLocaleString('en-US')}</option>`
            ).join('');
            renderAlerts();
        }

        function renderAlerts() {
            const list = document.getElementById('alerts-list');
            if (alerts.length === 0) {
                list.innerHTML = '<p class="loading-text">هنوز هشداری تنظیم نکردی</p>';
                return;
            }
            
            list.innerHTML = '';
            alerts.forEach((a, idx) => {
                const coin = allCoins.find(c => c.id === a.coinId);
                if (!coin) return;
                
                const price = coin.current_price;
                const triggered = (a.type === 'above' && price >= a.target) || (a.type === 'below' && price <= a.target);
                
                const card = document.createElement('div');
                card.className = `alert-card ${triggered ? 'triggered' : 'pending'}`;
                card.innerHTML = `
                    <div class="alert-coin-info">
                        <img src="${coin.image}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪙</text></svg>'">
                        <div>
                            <div class="alert-coin-name">${coin.name}</div>
                            <div class="alert-coin-symbol">${coin.symbol.toUpperCase()}</div>
                        </div>
                    </div>
                    <div class="alert-details">
                        <div class="alert-target">$${a.target.toLocaleString('en-US')}</div>
                        <div class="alert-type-label">${a.type === 'above' ? '📈 بالاتر از' : '📉 پایین‌تر از'}</div>
                        <div class="alert-status-badge ${triggered ? 'triggered' : 'pending'}">
                            ${triggered ? '✅ فعال شد' : '⏳ در انتظار'}
                        </div>
                    </div>
                    <button class="delete-alert" data-idx="${idx}">🗑</button>
                `;
                card.querySelector('.delete-alert').addEventListener('click', () => {
                    alerts.splice(idx, 1);
                    localStorage.setItem('alerts', JSON.stringify(alerts));
                    renderAlerts();
                });
                list.appendChild(card);
            });
        }

        document.getElementById('add-alert-btn').addEventListener('click', () => {
            const coinId = document.getElementById('coin-select').value;
            const target = parseFloat(document.getElementById('target-price').value);
            const type = document.querySelector('input[name="type"]:checked').value;
            
            if (!target || target <= 0) {
                alert('قیمت هدف رو درست وارد کن');
                return;
            }
            
            alerts.push({ coinId, target, type, notified: false, createdAt: Date.now() });
            localStorage.setItem('alerts', JSON.stringify(alerts));
            document.getElementById('target-price').value = '';
            
            if (Notification.permission === 'default') {
                Notification.requestPermission();
            }
            
            renderAlerts();
            alert('✅ هشدار اضافه شد!');
        });

        loadCoins();
        setInterval(loadCoins, 60000);
    </script>
</body>
</html>
