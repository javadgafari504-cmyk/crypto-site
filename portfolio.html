<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرتفوی من | کریپتو پرو</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .portfolio-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }
        .summary-card {
            background: linear-gradient(135deg, rgba(240,185,11,0.1), rgba(48,43,99,0.3));
            border: 1px solid rgba(240,185,11,0.2);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
        }
        .summary-label { font-size: 0.75rem; opacity: 0.7; margin-bottom: 8px; }
        .summary-value { font-size: 1.2rem; font-weight: 900; color: #f0b90b; direction: ltr; font-family: 'Courier New', monospace; }
        .summary-value.green { color: #0ecb81; }
        .summary-value.red { color: #f6465d; }
        
        .add-holding-form {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 10px;
            align-items: end;
        }
        body.light-mode .add-holding-form { background: #fff; }
        
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 6px; color: #f0b90b; font-weight: 700; }
        .form-group select, .form-group input {
            width: 100%; padding: 10px 12px; background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
            color: #fff; font-family: inherit; font-size: 0.9rem; outline: none;
        }
        body.light-mode .form-group select, body.light-mode .form-group input { background: rgba(0,0,0,0.04); color: #222; }
        
        .add-btn {
            padding: 12px 24px; background: linear-gradient(135deg, #0ecb81, #059669);
            border: none; border-radius: 10px; color: #fff; font-family: inherit;
            font-weight: 800; font-size: 0.9rem; cursor: pointer;
        }
        
        .holdings-list { display: flex; flex-direction: column; gap: 10px; }
        .holding-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
            display: grid;
            grid-template-columns: 40px 1fr auto auto auto;
            gap: 15px;
            align-items: center;
        }
        body.light-mode .holding-item { background: #fff; }
        
        .holding-item img { width: 40px; height: 40px; border-radius: 50%; }
        .holding-info { min-width: 0; }
        .holding-name { font-weight: 800; color: #f0b90b; font-size: 0.9rem; }
        .holding-amount { font-size: 0.8rem; opacity: 0.7; direction: ltr; }
        .holding-value { text-align: center; }
        .holding-value-label { font-size: 0.7rem; opacity: 0.6; }
        .holding-value-num { font-weight: 800; font-size: 0.9rem; direction: ltr; font-family: 'Courier New', monospace; }
        .holding-pl { font-size: 0.85rem; font-weight: 800; direction: ltr; }
        .holding-pl.positive { color: #0ecb81; }
        .holding-pl.negative { color: #f6465d; }
        .delete-holding {
            background: rgba(246,70,93,0.2); border: 1px solid rgba(246,70,93,0.3);
            color: #f6465d; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem;
        }
        
        @media (max-width: 768px) {
            .add-holding-form { grid-template-columns: 1fr 1fr; }
            .holding-item { grid-template-columns: 40px 1fr auto; gap: 10px; }
            .holding-item .holding-value:nth-child(4) { grid-column: 2; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <button id="theme-toggle">🌙</button>
            <div class="logo"><span class="logo-icon">💎</span><span class="logo-text">کریپتو پرو</span></div>
        </div>
        <nav class="main-nav">
            <a href="index.html" class="nav-link">🏠 خانه</a>
            <a href="markets.html" class="nav-link">📊 بازارها</a>
            <a href="portfolio.html" class="nav-link active">💼 پرتفوی</a>
            <a href="calculator.html" class="nav-link">🧮 ماشین‌حساب</a>
            <a href="compare.html" class="nav-link">⚖️ مقایسه</a>
            <a href="news.html" class="nav-link">📰 اخبار</a>
            <a href="alerts.html" class="nav-link">🔔 هشدارها</a>
        </nav>
    </header>

    <main>
        <h1 style="color:#f0b90b; text-align:center; margin-bottom:25px;">💼 پرتفوی من</h1>
        
        <div class="portfolio-summary" id="summary">
            <div class="summary-card">
                <div class="summary-label">💰 ارزش کل</div>
                <div class="summary-value" id="total-value">$0</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">📊 سود/ضرر کل</div>
                <div class="summary-value" id="total-pl">$0</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">📈 درصد سود</div>
                <div class="summary-value" id="total-pl-percent">0%</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">🪙 تعداد ارزها</div>
                <div class="summary-value" id="total-count">0</div>
            </div>
        </div>

        <div class="add-holding-form">
            <div class="form-group">
                <label>ارز</label>
                <select id="coin-select"></select>
            </div>
            <div class="form-group">
                <label>مقدار</label>
                <input type="number" id="amount-input" step="any" placeholder="0.5">
            </div>
            <div class="form-group">
                <label>قیمت خرید ($)</label>
                <input type="number" id="buy-price-input" step="any" placeholder="50000">
            </div>
            <button class="add-btn" id="add-holding-btn">➕ افزودن</button>
        </div>

        <h2 class="section-title">📋 دارایی‌های من</h2>
        <div class="holdings-list" id="holdings-list">
            <p class="loading-text">هنوز چیزی اضافه نکردی</p>
        </div>
    </main>

    <footer><div class="footer-bottom"><p>© ۲۰۲۶ کریپتو پرو</p></div></footer>

    <script>
        const API = 'https://api.coingecko.com/api/v3';
        let allCoins = [];
        let holdings = JSON.parse(localStorage.getItem('portfolio') || '[]');

        const themeBtn = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); themeBtn.textContent = '☀️'; }
        else themeBtn.textContent = '🌙';
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            themeBtn.textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        });

        async function loadCoins() {
            try {
                const res = await fetch(`${API}/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1`);
                allCoins = await res.json();
                const select = document.getElementById('coin-select');
                select.innerHTML = allCoins.map(c => `<option value="${c.id}">${c.name} (${c.symbol.toUpperCase()})</option>`).join('');
                renderPortfolio();
            } catch (e) { console.error(e); }
        }

        function renderPortfolio() {
            const list = document.getElementById('holdings-list');
            if (holdings.length === 0) {
                list.innerHTML = '<p class="loading-text">هنوز چیزی اضافه نکردی</p>';
                updateSummary();
                return;
            }
            list.innerHTML = '';
            holdings.forEach((h, idx) => {
                const coin = allCoins.find(c => c.id === h.coinId);
                if (!coin) return;
                const currentValue = h.amount * coin.current_price;
                const costValue = h.amount * h.buyPrice;
                const pl = currentValue - costValue;
                const plPercent = costValue > 0 ? (pl / costValue) * 100 : 0;
                const cls = pl >= 0 ? 'positive' : 'negative';
                
                const item = document.createElement('div');
                item.className = 'holding-item';
                item.innerHTML = `
                    <img src="${coin.image}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪙</text></svg>'">
                    <div class="holding-info">
                        <div class="holding-name">${coin.name}</div>
                        <div class="holding-amount">${h.amount} ${coin.symbol.toUpperCase()} @ $${h.buyPrice.toLocaleString('en-US')}</div>
                    </div>
                    <div class="holding-value">
                        <div class="holding-value-label">ارزش</div>
                        <div class="holding-value-num">$${currentValue.toLocaleString('en-US', { maximumFractionDigits: 2 })}</div>
                    </div>
                    <div class="holding-pl ${cls}">
                        ${pl >= 0 ? '+' : ''}$${Math.abs(pl).toLocaleString('en-US', { maximumFractionDigits: 2 })}
                        <br><small>(${plPercent >= 0 ? '+' : ''}${plPercent.toFixed(2)}%)</small>
                    </div>
                    <button class="delete-holding" data-idx="${idx}">🗑</button>
                `;
                item.querySelector('.delete-holding').addEventListener('click', () => {
                    holdings.splice(idx, 1);
                    savePortfolio();
                });
                list.appendChild(item);
            });
            updateSummary();
        }

        function updateSummary() {
            let totalValue = 0, totalCost = 0;
            holdings.forEach(h => {
                const coin = allCoins.find(c => c.id === h.coinId);
                if (!coin) return;
                totalValue += h.amount * coin.current_price;
                totalCost += h.amount * h.buyPrice;
            });
            const pl = totalValue - totalCost;
            const plPercent = totalCost > 0 ? (pl / totalCost) * 100 : 0;
            
            document.getElementById('total-value').textContent = '$' + totalValue.toLocaleString('en-US', { maximumFractionDigits: 2 });
            
            const plEl = document.getElementById('total-pl');
            plEl.textContent = (pl >= 0 ? '+' : '') + '$' + Math.abs(pl).toLocaleString('en-US', { maximumFractionDigits: 2 });
            plEl.className = 'summary-value ' + (pl >= 0 ? 'green' : 'red');
            
            const pctEl = document.getElementById('total-pl-percent');
            pctEl.textContent = (plPercent >= 0 ? '+' : '') + plPercent.toFixed(2) + '%';
            pctEl.className = 'summary-value ' + (plPercent >= 0 ? 'green' : 'red');
            
            document.getElementById('total-count').textContent = holdings.length.toLocaleString('fa-IR');
        }

        function savePortfolio() {
            localStorage.setItem('portfolio', JSON.stringify(holdings));
            renderPortfolio();
        }

        document.getElementById('add-holding-btn').addEventListener('click', () => {
            const coinId = document.getElementById('coin-select').value;
            const amount = parseFloat(document.getElementById('amount-input').value);
            const buyPrice = parseFloat(document.getElementById('buy-price-input').value);
            
            if (!amount || !buyPrice || amount <= 0 || buyPrice <= 0) {
                alert('لطفاً مقدار و قیمت خرید را درست وارد کن');
                return;
            }
            
            holdings.push({ coinId, amount, buyPrice, addedAt: Date.now() });
            savePortfolio();
            
            document.getElementById('amount-input').value = '';
            document.getElementById('buy-price-input').value = '';
        });

        loadCoins();
        setInterval(loadCoins, 60000);
    </script>
</body>
</html>
