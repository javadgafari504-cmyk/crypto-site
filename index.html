<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قیمت لحظه‌ای ارز دیجیتال به تومان | ۲۰۰ ارز برتر</title>
    <meta name="description" content="مشاهده قیمت لحظه‌ای، نمودار ۷ روزه و درصد تغییرات ۲۰۰ ارز دیجیتال برتر به دلار و تومان.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <button id="theme-toggle" title="تغییر تم">🌙</button>
        <h1>💰 قیمت ارز دیجیتال</h1>
        <p id="last-update">در حال دریافت...</p>
    </header>

    <main>
        <div class="search-box">
            <input 
                type="text" 
                id="search-input" 
                placeholder="🔍 جستجو (مثلاً Bitcoin یا BTC)..."
                autocomplete="off"
            >
        </div>

        <div class="filter-buttons">
            <button id="show-all" class="filter-btn active">🌐 همه ارزها</button>
            <button id="show-favorites" class="filter-btn">
                ⭐ علاقه‌مندی‌ها (<span id="fav-count">0</span>)
            </button>
        </div>

        <div id="crypto-grid">
            <p style="text-align:center; padding:40px;">⏳ در حال دریافت...</p>
        </div>

        <!-- دکمه‌های صفحه‌بندی -->
        <div class="pagination" id="pagination">
            <button id="prev-page" class="page-btn">◀ قبلی</button>
            <span id="page-info">صفحه ۱</span>
            <button id="next-page" class="page-btn">بعدی ▶</button>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <div id="chart-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">✖</button>
            <div class="modal-header">
                <img id="modal-logo" src="" alt="" class="modal-logo">
                <div>
                    <h2 id="modal-name">-</h2>
                    <p id="modal-price">-</p>
                </div>
            </div>
            <p id="modal-change">-</p>
            <div class="chart-container">
                <canvas id="price-chart"></canvas>
            </div>
            <p class="chart-label">نمودار قیمت ۷ روز اخیر (دلار)</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
