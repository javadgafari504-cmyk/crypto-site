<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    
    <title>قیمت لحظه‌ای ارز دیجیتال به تومان | ۲۰۰ ارز برتر با نمودار</title>
    <meta name="description" content="مشاهده قیمت لحظه‌ای، نمودار ۷ روزه و درصد تغییرات ۲۰۰ ارز دیجیتال برتر به دلار و تومان. به‌روزرسانی خودکار هر ۶۰ ثانیه.">
    <meta name="keywords" content="قیمت ارز دیجیتال، قیمت بیت کوین، قیمت اتریوم، ارز دیجیتال به تومان">
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="قیمت لحظه‌ای ارز دیجیتال به تومان | ۲۰۰ ارز برتر">
    <meta property="og:description" content="مشاهده قیمت لحظه‌ای ۲۰۰ ارز دیجیتال برتر به دلار و تومان با نمودار ۷ روزه.">
    <meta property="og:url" content="https://javadgafari504-cmyk.github.io/crypto-site/">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header role="banner">
        <button id="theme-toggle" title="تغییر تم" aria-label="تغییر حالت شب و روز">🌙</button>
        <h1>💰 قیمت لحظه‌ای ارز دیجیتال</h1>
        <p id="last-update" aria-live="polite">در حال دریافت...</p>
    </header>

    <main role="main">

        <div class="search-box">
            <input 
                type="text" 
                id="search-input" 
                placeholder="🔍 جستجو (مثلاً Bitcoin یا BTC)..."
                autocomplete="off"
                aria-label="جستجوی ارز دیجیتال"
            >
        </div>

        <div class="filter-buttons" role="tablist">
            <button id="show-all" class="filter-btn active" role="tab" aria-selected="true">
                🌐 همه ارزها
            </button>
            <button id="show-favorites" class="filter-btn" role="tab" aria-selected="false">
                ⭐ علاقه‌مندی‌ها (<span id="fav-count">0</span>)
            </button>
        </div>

        <section id="crypto-grid" aria-label="لیست ارزهای دیجیتال" aria-live="polite">
            <p style="text-align:center; padding:40px;">⏳ در حال دریافت قیمت‌ها...</p>
        </section>

        <nav class="pagination" id="pagination" aria-label="صفحه‌بندی">
            <button id="prev-page" class="page-btn" aria-label="صفحه قبلی">◀ قبلی</button>
            <span id="page-info" aria-live="polite">صفحه ۱</span>
            <button id="next-page" class="page-btn" aria-label="صفحه بعدی">بعدی ▶</button>
        </nav>

        <nav style="text-align: center; padding: 10px 0 30px;" aria-label="لینک‌های مفید">
            <a href="about.html" style="color: #f0b90b; text-decoration: none; font-weight: bold; font-size: 0.95rem;">
                📄 درباره ما
            </a>
        </nav>

    </main>

    <footer role="contentinfo">
        <p>داده‌ها از CoinGecko | به‌روزرسانی خودکار هر ۶۰ ثانیه</p>
        <p style="margin-top: 8px; font-size: 0.75rem;">
            © ۲۰۲۶ سایت قیمت ارز دیجیتال | تمامی حقوق محفوظ است
        </p>
        
        <!-- شمارنده بازدید -->
        <div style="margin-top: 20px; text-align: center;">
            <a href="https://hits.sh/javadgafari504-cmyk.github.io/crypto-site/" target="_blank">
                <img alt="بازدیدها" src="https://hits.sh/javadgafari504-cmyk.github.io/crypto-site.svg"/>
            </a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <div id="chart-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-name">
        <div class="modal-content">
            <button class="modal-close" id="modal-close" aria-label="بستن">✖</button>
            <div class="modal-header">
                <img id="modal-logo" src="" alt="" class="modal-logo">
                <div>
                    <h2 id="modal-name">-</h2>
                    <p id="modal-price">-</p>
                </div>
            </div>
            <p id="modal-change">-</p>
            <div class="chart-container">
                <canvas id="price-chart"></canvas>
            </div>
            <p class="chart-label">نمودار قیمت ۷ روز اخیر (دلار)</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
