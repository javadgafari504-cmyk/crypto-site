<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>جزئیات ارز دیجیتال | قیمت ارز دیجیتال</title>
    <meta name="description" content="جزئیات کامل ارز دیجیتال شامل قیمت لحظه‌ای، مارکت‌کپ، حجم معاملات و نمودار تاریخی ۱ روزه تا ۱ ساله.">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header role="banner">
        <button id="theme-toggle" title="تغییر تم">🌙</button>
        <h1 id="coin-title">💰 جزئیات ارز</h1>
        <p>
            <a href="index.html" style="color: #f0b90b; text-decoration: none; font-weight: bold;">
                🏠 بازگشت به خانه
            </a>
        </p>
    </header>

    <main role="main">

        <!-- هیرو کارت ارز -->
        <div id="coin-hero" class="coin-hero">
            <div class="hero-skeleton">
                <div class="skeleton-circle"></div>
                <div class="skeleton-lines">
                    <div class="skeleton-line" style="width: 60%;"></div>
                    <div class="skeleton-line" style="width: 40%;"></div>
                    <div class="skeleton-line" style="width: 80%;"></div>
                </div>
            </div>
        </div>

        <!-- دکمه‌های بازه زمانی نمودار -->
        <div class="chart-buttons" id="detail-chart-buttons">
            <button class="chart-period-btn" data-days="1">📅 ۱ روز</button>
            <button class="chart-period-btn active" data-days="7">📅 ۷ روز</button>
            <button class="chart-period-btn" data-days="30">📅 ۳۰ روز</button>
            <button class="chart-period-btn" data-days="90">📅 ۳ ماه</button>
            <button class="chart-period-btn" data-days="365">📅 ۱ سال</button>
        </div>

        <!-- کارت نمودار -->
        <div class="chart-card">
            <div class="chart-header">
                <h3>📊 نمودار قیمت</h3>
                <span class="chart-change" id="chart-change-badge">-</span>
            </div>
            <div class="chart-container" style="height: 340px;">
                <canvas id="detail-chart"></canvas>
            </div>
        </div>

        <!-- آمار تفصیلی -->
        <h2 class="section-title">📈 آمار و اطلاعات</h2>
        <div id="coin-stats" class="stats-grid"></div>

        <!-- اطلاعات بیشتر -->
        <h2 class="section-title" style="margin-top: 30px;">💰 اطلاعات مالی</h2>
        <div id="financial-info" class="stats-grid"></div>

        <!-- توضیحات ارز -->
        <div class="description-card">
            <div class="description-header">
                <h2>📖 درباره این ارز</h2>
                <button id="toggle-desc" class="toggle-btn">نمایش کامل</button>
            </div>
            <p id="description-text" class="description-text">در حال دریافت...</p>
        </div>

        <!-- لینک‌های مفید -->
        <div class="links-card">
            <h2>🔗 لینک‌های مفید</h2>
            <div class="links-grid" id="useful-links"></div>
        </div>

    </main>

    <footer role="contentinfo">
        <p>داده‌ها از CoinGecko</p>
        <p style="margin-top: 8px; font-size: 0.75rem;">© ۲۰۲۶ سایت قیمت ارز دیجیتال</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <script>
        /* ============================================
           صفحه جزئیات ارز - نسخه حرفه‌ای
           ============================================ */
        
        const API = 'https://api.coingecko.com/api/v3';
        const params = new URLSearchParams(location.search);
        const coinId = params.get('id') || 'bitcoin';
        let chartInst = null;
        let currentDays = 7;
        let coinData = null;

        /* ===== مدیریت تم ===== */
        const themeBtn = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            themeBtn.textContent = '☀️';
        } else {
            themeBtn.textContent = '🌙';
        }
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeBtn.textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        });

        /* ===== فرمت اعداد ===== */
        function formatNumber(num, decimals = 2) {
            if (num === null || num === undefined) return '—';
            if (num >= 1e12) return '$' + (num / 1e12).toFixed(decimals) + 'T';
            if (num >= 1e9) return '$' + (num / 1e9).toFixed(decimals) + 'B';
            if (num >= 1e6) return '$' + (num / 1e6).toFixed(decimals) + 'M';
            if (num >= 1e3) return '$' + (num / 1e3).toFixed(decimals) + 'K';
            return '$' + num.toLocaleString('en-US', { maximumFractionDigits: decimals });
        }

        function formatPrice(price) {
            if (price === null || price === undefined) return '—';
            if (price < 0.01) return '$' + price.toFixed(8);
            if (price < 1) return '$' + price.toFixed(6);
            if (price < 100) return '$' + price.toFixed(4);
            return '$' + price.toLocaleString('en-US', { maximumFractionDigits: 2 });
        }

        /* ===== دریافت اطلاعات ارز ===== */
        async function loadCoin() {
            try {
                const res = await fetch(
                    `${API}/coins/${coinId}?localization=false&tickers=false&community_data=false&developer_data=false`
                );
                
                if (!res.ok) throw new Error('خطای شبکه');
                
                const data = await res.json();
                coinData = data;
                const md = data.market_data;
                
                // عنوان صفحه
                document.title = `قیمت ${data.name} (${data.symbol.toUpperCase()}) | قیمت ارز دیجیتال`;
                document.getElementById('coin-title').textContent = 
                    `💰 ${data.name}`;
                
                // هیرو کارت
                const change24h = md.price_change_percentage_24h || 0;
                const change7d = md.price_change_percentage_7d || 0;
                const cls24 = change24h >= 0 ? 'positive' : 'negative';
                
                document.getElementById('coin-hero').innerHTML = `
                    <div class="hero-content">
                        <div class="hero-top">
                            <div class="hero-logo-wrap">
                                <img src="${data.image.large}" alt="${data.name}" class="hero-logo">
                                <span class="rank-badge">#${data.market_cap_rank || '—'}</span>
                            </div>
                            <div class="hero-info">
                                <h1 class="hero-name">${data.name}</h1>
                                <p class="hero-symbol">${data.symbol.toUpperCase()}</p>
                                <div class="hero-price-row">
                                    <span class="hero-price">${formatPrice(md.current_price.usd)}</span>
                                    <span class="hero-change ${cls24}">
                                        ${change24h >= 0 ? '▲' : '▼'} ${Math.abs(change24h).toFixed(2)}%
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="hero-bottom">
                            <div class="hero-mini-stat">
                                <span class="mini-label">۷ روز</span>
                                <span class="mini-value ${change7d >= 0 ? 'positive' : 'negative'}">
                                    ${change7d >= 0 ? '▲' : '▼'} ${Math.abs(change7d).toFixed(2)}%
                                </span>
                            </div>
                            <div class="hero-mini-stat">
                                <span class="mini-label">۲۴h بالا</span>
                                <span class="mini-value">${formatPrice(md.high_24h.usd)}</span>
                            </div>
                            <div class="hero-mini-stat">
                                <span class="mini-label">۲۴h پایین</span>
                                <span class="mini-value">${formatPrice(md.low_24h.usd)}</span>
                            </div>
                        </div>
                    </div>
                `;
                
                // آمار اصلی
                const stats = [
                    { icon: '💎', label: 'مارکت‌کپ', value: formatNumber(md.market_cap.usd), rank: `#${data.market_cap_rank}` },
                    { icon: '📊', label: 'حجم ۲۴ ساعت', value: formatNumber(md.total_volume.usd) },
                    { icon: '🔺', label: 'بالاترین تاریخ', value: formatPrice(md.ath.usd), extra: `${(md.ath_change_percentage.usd || 0).toFixed(1)}%` },
                    { icon: '🔻', label: 'پایین‌ترین ۲۴h', value: formatPrice(md.low_24h.usd) },
                    { icon: '📈', label: 'تغییرات ۳۰ روز', value: `${(md.price_change_percentage_30d || 0).toFixed(2)}%` },
                    { icon: '📅', label: 'تغییرات ۱ سال', value: `${(md.price_change_percentage_1y || 0).toFixed(2)}%` }
                ];
                
                document.getElementById('coin-stats').innerHTML = stats.map(s => `
                    <div class="stat-card">
                        <div class="stat-icon">${s.icon}</div>
                        <div class="stat-label">${s.label}</div>
                        <div class="stat-value">${s.value}</div>
                        ${s.rank ? `<div class="stat-extra">رتبه ${s.rank}</div>` : ''}
                        ${s.extra ? `<div class="stat-extra">${s.extra} از ATH</div>` : ''}
                    </div>
                `).join('');
                
                // اطلاعات مالی
                const financial = [
                    { icon: '🪙', label: 'عرضه کل', value: md.total_supply ? md.total_supply.toLocaleString('en-US', { maximumFractionDigits: 0 }) : '—' },
                    { icon: '🔄', label: 'عرضه در گردش', value: md.circulating_supply ? md.circulating_supply.toLocaleString('en-US', { maximumFractionDigits: 0 }) : '—' },
                    { icon: '💵', label: 'ارزش کاملاً رقیق‌شده', value: md.fully_diluted_valuation?.usd ? formatNumber(md.fully_diluted_valuation.usd) : '—' }
                ];
                
                document.getElementById('financial-info').innerHTML = financial.map(s => `
                    <div class="stat-card">
                        <div class="stat-icon">${s.icon}</div>
                        <div class="stat-label">${s.label}</div>
                        <div class="stat-value">${s.value}</div>
                    </div>
                `).join('');
                
                // توضیحات
                const desc = data.description?.fa || data.description?.en || 'توضیحی برای این ارز موجود نیست.';
                const cleanDesc = desc.replace(/<[^>]*>/g, '');
                document.getElementById('description-text').textContent = cleanDesc;
                
                // دکمه نمایش کامل
                const descText = document.getElementById('description-text');
                const toggleBtn = document.getElementById('toggle-desc');
                if (cleanDesc.length > 300) {
                    descText.style.maxHeight = '100px';
                    descText.style.overflow = 'hidden';
                    toggleBtn.addEventListener('click', () => {
                        if (descText.style.maxHeight === '100px') {
                            descText.style.maxHeight = 'none';
                            toggleBtn.textContent = 'بستن';
                        } else {
                            descText.style.maxHeight = '100px';
                            toggleBtn.textContent = 'نمایش کامل';
                        }
                    });
                } else {
                    toggleBtn.style.display = 'none';
                }
                
                // لینک‌های مفید
                const links = [];
                if (data.links?.homepage?.[0]) {
                    links.push({ icon: '🌐', label: 'وب‌سایت رسمی', url: data.links.homepage[0] });
                }
                if (data.links?.blockchain_site?.[0]) {
                    links.push({ icon: '🔗', label: 'اکسپلورر بلاک‌چین', url: data.links.blockchain_site[0] });
                }
                if (data.links?.whitepaper) {
                    links.push({ icon: '📄', label: 'وایت‌پیپر', url: data.links.whitepaper });
                }
                if (data.links?.subreddit_url) {
                    links.push({ icon: '💬', label: 'Reddit', url: data.links.subreddit_url });
                }
                if (data.links?.repos_url?.github?.[0]) {
                    links.push({ icon: '💻', label: 'GitHub', url: data.links.repos_url.github[0] });
                }
                
                if (links.length > 0) {
                    document.getElementById('useful-links').innerHTML = links.map(l => `
                        <a href="${l.url}" target="_blank" rel="noopener" class="link-btn">
                            <span class="link-icon">${l.icon}</span>
                            <span>${l.label}</span>
                        </a>
                    `).join('');
                } else {
                    document.getElementById('useful-links').innerHTML = 
                        '<p style="text-align:center; opacity:0.6;">لینکی موجود نیست</p>';
                }
                
                // بارگذاری نمودار
                loadChart(7);
                
            } catch (e) {
                console.error('خطا:', e);
                document.getElementById('coin-hero').innerHTML = 
                    '<p class="loading-text">❌ خطا در دریافت اطلاعات</p>';
            }
        }

        /* ===== نمودار ===== */
        async function loadChart(days) {
            const container = document.querySelector('.chart-container');
            
            try {
                container.innerHTML = '<p style="text-align:center; padding:50px; opacity:0.6;">⏳ در حال دریافت...</p>';
                
                const res = await fetch(`${API}/coins/${coinId}/market_chart?vs_currency=usd&days=${days}`);
                if (!res.ok) throw new Error('خطای شبکه');
                
                const data = await res.json();
                const prices = data.prices;
                
                container.innerHTML = '<canvas id="detail-chart"></canvas>';
                const ctx = document.getElementById('detail-chart').getContext('2d');
                
                const labels = prices.map(p => {
                    const d = new Date(p[0]);
                    if (days === 1) return d.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
                    if (days === 365) return d.toLocaleDateString('fa-IR', { month: 'short', year: '2-digit' });
                    return d.toLocaleDateString('fa-IR', { month: 'short', day: 'numeric' });
                });
                const values = prices.map(p => p[1]);
                
                const firstPrice = values[0];
                const lastPrice = values[values.length - 1];
                const changePercent = ((lastPrice - firstPrice) / firstPrice) * 100;
                
                // نمایش درصد تغییر در هدر نمودار
                const badge = document.getElementById('chart-change-badge');
                if (badge) {
                    badge.textContent = `${changePercent >= 0 ? '▲ +' : '▼ '}${changePercent.toFixed(2)}%`;
                    badge.className = 'chart-change ' + (changePercent >= 0 ? 'positive' : 'negative');
                }
                
                const isUp = lastPrice >= firstPrice;
                const lineColor = isUp ? '#0ecb81' : '#f6465d';
                const fillColor = isUp ? 'rgba(14, 203, 129, 0.15)' : 'rgba(246, 70, 93, 0.15)';
                
                if (chartInst) chartInst.destroy();
                
                // گرادیانت زیر نمودار
                const gradient = ctx.createLinearGradient(0, 0, 0, 340);
                gradient.addColorStop(0, fillColor);
                gradient.addColorStop(1, 'rgba(0,0,0,0)');
                
                chartInst = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'قیمت',
                            data: values,
                            borderColor: lineColor,
                            backgroundColor: gradient,
                            borderWidth: 2.5,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 0,
                            pointHoverRadius: 7,
                            pointHoverBackgroundColor: lineColor,
                            pointHoverBorderColor: '#fff',
                            pointHoverBorderWidth: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { intersect: false, mode: 'index' },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: 'rgba(0, 0, 0, 0.95)',
                                padding: 14,
                                cornerRadius: 10,
                                titleFont: { family: 'Vazirmatn', size: 12 },
                                bodyFont: { family: 'Vazirmatn', size: 14, weight: 'bold' },
                                borderColor: lineColor,
                                borderWidth: 2,
                                displayColors: false,
                                callbacks: {
                                    label: (context) => formatPrice(context.parsed.y)
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: { display: false },
                                ticks: {
                                    color: 'rgba(255, 255, 255, 0.5)',
                                    font: { family: 'Vazirmatn', size: 10 },
                                    maxTicksLimit: 6
                                }
                            },
                            y: {
                                position: 'right',
                                grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                ticks: {
                                    color: 'rgba(255, 255, 255, 0.5)',
                                    font: { family: 'Vazirmatn', size: 10 },
                                    callback: (value) => {
                                        if (value >= 1e9) return '$' + (value / 1e9).toFixed(1) + 'B';
                                        if (value >= 1e6) return '$' + (value / 1e6).toFixed(1) + 'M';
                                        if (value >= 1e3) return '$' + (value / 1e3).toFixed(1) + 'K';
                                        return '$' + value.toFixed(2);
                                    }
                                }
                            }
                        }
                    }
                });
                
            } catch (error) {
                console.error(error);
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#f6465d;">❌ خطا در دریافت نمودار</p>';
            }
        }

        /* ===== دکمه‌های بازه زمانی ===== */
        document.querySelectorAll('#detail-chart-buttons .chart-period-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#detail-chart-buttons .chart-period-btn').forEach(b => 
                    b.classList.remove('active')
                );
                btn.classList.add('active');
                currentDays = parseInt(btn.dataset.days);
                loadChart(currentDays);
            });
        });

        /* ===== شروع ===== */
        loadCoin();

    </script>

</body>
</html>
