<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزئیات ارز | کریپتو پرو</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .coin-hero {
            background: linear-gradient(135deg, rgba(240,185,11,0.08), rgba(48,43,99,0.4));
            border: 1px solid rgba(240,185,11,0.2);
            border-radius: 20px; padding: 25px 20px;
            margin-bottom: 25px; position: relative; overflow: hidden;
        }
        body.light-mode .coin-hero { background: linear-gradient(135deg, #fff, #f9f9fb); }
        .hero-top { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; flex-wrap: wrap; }
        .hero-logo { width: 80px; height: 80px; border-radius: 50%; padding: 5px; background: rgba(255,255,255,0.05); box-shadow: 0 0 30px rgba(240,185,11,0.3); }
        .hero-info { flex: 1; min-width: 180px; }
        .hero-name { font-size: 1.5rem; font-weight: 900; color: #f0b90b; margin-bottom: 5px; }
        .hero-symbol { font-size: 0.85rem; opacity: 0.6; letter-spacing: 1px; }
        .hero-price { font-size: 1.8rem; font-weight: 900; direction: ltr; font-family: 'Courier New', monospace; margin: 8px 0; }
        .hero-change { font-size: 0.95rem; font-weight: 800; padding: 5px 14px; border-radius: 20px; display: inline-block; }
        .hero-change.positive { color: #0ecb81; background: rgba(14,203,129,0.15); }
        .hero-change.negative { color: #f6465d; background: rgba(246,70,93,0.15); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 20px; }
        .stat-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 18px; text-align: center; transition: all 0.3s; }
        body.light-mode .stat-card { background: #fff; }
        .stat-card:hover { transform: translateY(-4px); border-color: rgba(240,185,11,0.4); }
        .stat-icon { font-size: 1.5rem; margin-bottom: 6px; }
        .stat-label { font-size: 0.72rem; opacity: 0.7; margin-bottom: 6px; }
        .stat-value { font-size: 1rem; font-weight: 900; color: #f0b90b; direction: ltr; font-family: 'Courier New', monospace; }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <button id="theme-toggle">🌙</button>
            <div class="logo"><span class="logo-icon">💎</span><span class="logo-text">کریپتو پرو</span></div>
        </div>
        <nav class="main-nav">
            <a href="index.html" class="nav-link">🏠 خانه</a>
            <a href="markets.html" class="nav-link">📊 بازارها</a>
            <a href="portfolio.html" class="nav-link">💼 پرتفوی</a>
            <a href="calculator.html" class="nav-link">🧮 ماشین‌حساب</a>
            <a href="compare.html" class="nav-link">⚖️ مقایسه</a>
            <a href="news.html" class="nav-link">📰 اخبار</a>
            <a href="alerts.html" class="nav-link">🔔 هشدارها</a>
        </nav>
    </header>

    <main>
        <div id="coin-hero" class="coin-hero">
            <p class="loading-text">⏳ در حال دریافت اطلاعات...</p>
        </div>

        <div class="chart-buttons" id="chart-buttons">
            <button class="chart-period-btn" data-days="1">📅 ۱ روز</button>
            <button class="chart-period-btn active" data-days="7">📅 ۷ روز</button>
            <button class="chart-period-btn" data-days="30">📅 ۳۰ روز</button>
            <button class="chart-period-btn" data-days="90">📅 ۳ ماه</button>
            <button class="chart-period-btn" data-days="365">📅 ۱ سال</button>
        </div>

        <div class="chart-container" style="height: 340px; margin: 20px 0;">
            <canvas id="detail-chart"></canvas>
        </div>

        <h2 class="section-title">📈 آمار و اطلاعات</h2>
        <div id="coin-stats" class="stats-grid"></div>

        <h2 class="section-title" style="margin-top: 25px;">💰 اطلاعات مالی</h2>
        <div id="financial-info" class="stats-grid"></div>

        <div class="description-card" style="margin-top: 25px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 22px;">
            <h2 style="color:#f0b90b; font-size:1.05rem; margin-bottom:12px;">📖 درباره این ارز</h2>
            <p id="description-text" style="font-size:0.88rem; line-height:1.9; opacity:0.85;">در حال دریافت...</p>
        </div>
    </main>

    <footer><div class="footer-bottom"><p>© ۲۰۲۶ کریپتو پرو</p></div></footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        const API = 'https://api.coingecko.com/api/v3';
        const params = new URLSearchParams(location.search);
        const coinId = params.get('id') || 'bitcoin';
        let chartInst = null;

        const themeBtn = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); themeBtn.textContent = '☀️'; }
        else themeBtn.textContent = '🌙';
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            themeBtn.textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        });

        function fmt(n) {
            if (!n) return '—';
            if (n >= 1e12) return '$' + (n / 1e12).toFixed(2) + 'T';
            if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
            if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
            return '$' + n.toLocaleString('en-US');
        }
        function fp(p) {
            if (!p) return '—';
            if (p < 0.01) return '$' + p.toFixed(8);
            if (p < 1) return '$' + p.toFixed(6);
            return '$' + p.toLocaleString('en-US', { maximumFractionDigits: 2 });
        }

        async function load() {
            try {
                const res = await fetch(`${API}/coins/${coinId}?localization=false&tickers=false&community_data=false&developer_data=false`);
                const data = await res.json();
                const md = data.market_data;
                
                document.title = `قیمت ${data.name} | کریپتو پرو`;
                
                const change = md.price_change_percentage_24h || 0;
                const cls = change >= 0 ? 'positive' : 'negative';
                
                document.getElementById('coin-hero').innerHTML = `
                    <div class="hero-top">
                        <img src="${data.image.large}" class="hero-logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪙</text></svg>'">
                        <div class="hero-info">
                            <div class="hero-name">${data.name}</div>
                            <div class="hero-symbol">${data.symbol.toUpperCase()} • رتبه #${data.market_cap_rank}</div>
                            <div class="hero-price">${fp(md.current_price.usd)}</div>
                            <span class="hero-change ${cls}">${change >= 0 ? '▲ +' : '▼ '}${Math.abs(change).toFixed(2)}% (۲۴ ساعت)</span>
                        </div>
                    </div>
                `;
                
                const stats = [
                    { i: '💎', l: 'مارکت‌کپ', v: fmt(md.market_cap.usd) },
                    { i: '📊', l: 'حجم ۲۴h', v: fmt(md.total_volume.usd) },
                    { i: '🔺', l: 'بالاترین ۲۴h', v: fp(md.high_24h.usd) },
                    { i: '🔻', l: 'پایین‌ترین ۲۴h', v: fp(md.low_24h.usd) },
                    { i: '📈', l: 'تغییرات ۷d', v: (md.price_change_percentage_7d || 0).toFixed(2) + '%' },
                    { i: '📉', l: 'تغییرات ۳۰d', v: (md.price_change_percentage_30d || 0).toFixed(2) + '%' },
                    { i: '🏆', l: 'بالاترین تاریخ', v: fp(md.ath.usd) },
                    { i: '📅', l: 'تغییرات ۱ سال', v: (md.price_change_percentage_1y || 0).toFixed(2) + '%' }
                ];
                
                document.getElementById('coin-stats').innerHTML = stats.map(s => `
                    <div class="stat-card"><div class="stat-icon">${s.i}</div><div class="stat-label">${s.l}</div><div class="stat-value">${s.v}</div></div>
                `).join('');
                
                const fin = [
                    { i: '🪙', l: 'عرضه کل', v: md.total_supply ? md.total_supply.toLocaleString('en-US', { maximumFractionDigits: 0 }) : '—' },
                    { i: '🔄', l: 'عرضه در گردش', v: md.circulating_supply ? md.circulating_supply.toLocaleString('en-US', { maximumFractionDigits: 0 }) : '—' },
                    { i: '💵', l: 'ارزش کاملاً رقیق', v: md.fully_diluted_valuation?.usd ? fmt(md.fully_diluted_valuation.usd) : '—' }
                ];
                
                document.getElementById('financial-info').innerHTML = fin.map(s => `
                    <div class="stat-card"><div class="stat-icon">${s.i}</div><div class="stat-label">${s.l}</div><div class="stat-value">${s.v}</div></div>
                `).join('');
                
                const desc = data.description?.fa || data.description?.en || 'توضیحی موجود نیست.';
                document.getElementById('description-text').textContent = desc.replace(/<[^>]*>/g, '').substring(0, 1500);
                
                loadChart(7);
            } catch (e) {
                console.error(e);
                document.getElementById('coin-hero').innerHTML = '<p class="loading-text">❌ خطا در دریافت اطلاعات</p>';
            }
        }

        async function loadChart(days) {
            const container = document.querySelector('.chart-container');
            try {
                const res = await fetch(`${API}/coins/${coinId}/market_chart?vs_currency=usd&days=${days}`);
                const data = await res.json();
                const prices = data.prices;
                
                container.innerHTML = '<canvas id="detail-chart"></canvas>';
                const ctx = document.getElementById('detail-chart').getContext('2d');
                
                const labels = prices.map(p => {
                    const d = new Date(p[0]);
                    if (days === 1) return d.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
                    if (days === 365) return d.toLocaleDateString('fa-IR', { month: 'short', year: '2-digit' });
                    return d.toLocaleDateString('fa-IR', { month: 'short', day: 'numeric' });
                });
                const values = prices.map(p => p[1]);
                
                const isUp = values[values.length - 1] >= values[0];
                const lineColor = isUp ? '#0ecb81' : '#f6465d';
                const fillColor = isUp ? 'rgba(14,203,129,0.15)' : 'rgba(246,70,93,0.15)';
                
                if (chartInst) chartInst.destroy();
                
                const grad = ctx.createLinearGradient(0, 0, 0, 340);
                grad.addColorStop(0, fillColor);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                
                chartInst = new Chart(ctx, {
                    type: 'line',
                    data: { labels, datasets: [{ label: 'قیمت', data: values, borderColor: lineColor, backgroundColor: grad, borderWidth: 2.5, fill: true, tension: 0.4, pointRadius: 0, pointHoverRadius: 6 }] },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(0,0,0,0.95)', padding: 12, callbacks: { label: (c) => '$' + c.parsed.y.toLocaleString('en-US', { maximumFractionDigits: 2 }) } } },
                        scales: {
                            x: { grid: { display: false }, ticks: { color: 'rgba(255,255,255,0.5)', font: { size: 10 }, maxTicksLimit: 6 } },
                            y: { position: 'right', grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: 'rgba(255,255,255,0.5)', font: { size: 10 } } }
                        }
                    }
                });
            } catch (e) { container.innerHTML = '<p class="loading-text">❌ خطا</p>'; }
        }

        document.querySelectorAll('.chart-period-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.chart-period-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadChart(parseInt(btn.dataset.days));
            });
        });

        load();
    </script>
</body>
</html>
